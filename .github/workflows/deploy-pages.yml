name: Deploy FUTBOTS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # Sem lockfile no primeiro push: use "pnpm install".
        # Depois de gerar e commitar pnpm-lock.yaml, pode trocar para:
        #   pnpm install --frozen-lockfile
        run: pnpm install

      - name: Build static site
        env:
          # Project Pages: https://<org>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm run build

      # SPA: refresh em rotas internas não quebra no GitHub Pages
      - name: SPA fallback (404.html)
        run: cp dist/public/index.html dist/public/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
